[package]
name = "wowupd"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Installs and updates World of Warcraft clients from Blizzard's CDN, without the Battle.net launcher"

[features]
default = ["gui"]
# The GTK4 window, wowupd-gtk.
gui = ["dep:gtk4", "dep:async-channel"]

[dependencies]
anyhow = "1"
async-channel = { version = "2.5.0", optional = true }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
gtk4 = { version = "0.11", features = ["v4_12"], optional = true }
md-5 = "0.10"
ureq = "2"

[[bin]]
name = "wowupd-gtk"
required-features = ["gui"]

[profile.release]
debug = "line-tables-only"
